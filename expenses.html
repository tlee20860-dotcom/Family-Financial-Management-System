<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>每月總開銷 | 家庭財務</title>
  <link rel="stylesheet" href="./css/theme.css">
  <link rel="stylesheet" href="./css/layout.css">
  <link rel="stylesheet" href="./css/components.css">
</head>
<body>
  <div class="app-shell">
    <aside id="sidebar-root"></aside>
    <div class="main-area">
      <header id="navbar-root"></header>

      <main class="content">
        <div class="page-header" style="display:flex; justify-content:space-between; align-items:flex-end; gap:12px; flex-wrap:wrap;">
          <div>
            <h1 class="page-title">每月總開銷表</h1>
            <p class="page-subtitle" id="expenses-month">全家當月開銷匯總</p>
          </div>
          <div style="text-align:right;">
            <div class="glass-card-title" style="margin:0;">當月總支出</div>
            <div class="mono text-red" id="expenses-total" style="font-size:24px; font-weight:700;">HK$ 0</div>
          </div>
        </div>

        <div class="glass-card">
          <div style="overflow-x:auto;">
            <table class="data-table">
              <thead>
                <tr>
                  <th>成員</th>
                  <th style="text-align:right;">項目數</th>
                  <th style="text-align:right;">小計</th>
                </tr>
              </thead>
              <tbody id="expenses-tbody">
                <tr><td colspan="3" class="empty-state">載入中…</td></tr>
              </tbody>
            </table>
          </div>
        </div>
      </main>
    </div>
  </div>

  <script src="https://unpkg.com/lucide@latest"></script>
  <script type="module">
    import { initApp } from './js/app.js';
    import { initExpensesPage } from './js/expenses.js';

    await initApp({ activeHref: 'expenses.html', title: '每月總開銷表' });
    await initExpensesPage();
  </script>
</body>
</html>
