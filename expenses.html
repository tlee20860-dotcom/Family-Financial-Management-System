<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>每月總開銷 | 家庭財務</title>
  <link rel="stylesheet" href="./css/theme.css">
  <link rel="stylesheet" href="./css/layout.css">
  <link rel="stylesheet" href="./css/components.css">

  <style>
    /* ============================================
       列印專用樣式
       ============================================ */
    #print-area { display: none; }

    @media print {
      /* 隱藏整個 App 介面 */
      body { background: #ffffff !important; color: #000000 !important; }
      .app-shell { display: none !important; }
      .modal-overlay { display: none !important; }

      /* 只顯示列印區塊 */
      #print-area {
        display: block !important;
        position: static;
        width: 100%;
        color: #000 !important;
        background: #fff !important;
        font-family: 'PingFang TC', 'Microsoft JhengHei', 'Noto Sans TC', sans-serif;
      }

      @page {
        size: A4;
        margin: 15mm;
      }

      /* 防止表格行被切斷 */
      tr, .member-block { page-break-inside: avoid; }
      h1, h2, h3 { page-break-after: avoid; }
    }
  </style>
</head>
<body>
  <div class="app-shell">
    <aside id="sidebar-root"></aside>
    <div class="main-area">
      <header id="navbar-root"></header>

      <main class="content">
        <div class="page-header" style="display:flex; justify-content:space-between; align-items:flex-end; gap:12px; flex-wrap:wrap;">
          <div>
            <h1 class="page-title">每月總開銷表</h1>
            <p class="page-subtitle" id="expenses-month">全家當月開銷明細</p>
          </div>
          <div style="display:flex; gap:10px; flex-wrap:wrap;">
            <button class="btn btn-magenta" id="export-pdf-btn">
              <i data-lucide="download"></i> 匯出 PDF
            </button>
          </div>
        </div>

        <div class="grid grid-3" style="margin-bottom:20px;">
          <div class="glass-card">
            <div class="glass-card-title">成員代墊總額</div>
            <div class="glass-card-value red mono" id="expenses-member-total">HK$ 0</div>
          </div>
          <div class="glass-card">
            <div class="glass-card-title">家庭固定支出</div>
            <div class="glass-card-value orange mono" id="expenses-fixed-total">HK$ 0</div>
          </div>
          <div class="glass-card">
            <div class="glass-card-title">當月總支出</div>
            <div class="glass-card-value magenta mono" id="expenses-total">HK$ 0</div>
          </div>
        </div>

        <div id="member-sections"></div>

        <div class="glass-card" id="fixed-section" style="margin-top:20px;">
          <div class="glass-card-title" style="margin-bottom:12px;">家庭固定支出</div>
          <div style="overflow-x:auto;">
            <table class="data-table">
              <thead>
                <tr>
                  <th>項目名稱</th>
                  <th>週期</th>
                  <th>到期日</th>
                  <th style="text-align:right;">金額</th>
                  <th>狀態</th>
                </tr>
              </thead>
              <tbody id="fixed-tbody">
                <tr><td colspan="5" class="empty-state">載入中…</td></tr>
              </tbody>
            </table>
          </div>
        </div>
      </main>
    </div>
  </div>

  <!-- 列印專用區塊（螢幕上不顯示，列印時才呈現） -->
  <div id="print-area"></div>

  <script src="https://unpkg.com/lucide@latest"></script>
  <script type="module">
    import { initApp } from './js/app.js';
    import { initExpensesPage } from './js/expenses.js';

    await initApp({ activeHref: 'expenses.html', title: '每月總開銷表' });
    await initExpensesPage();
  </script>
</body>
</html>
