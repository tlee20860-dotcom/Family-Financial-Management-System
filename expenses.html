<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>每月總開銷 | 家庭財務</title>
  <link rel="stylesheet" href="./css/theme.css">
  <link rel="stylesheet" href="./css/layout.css">
  <link rel="stylesheet" href="./css/components.css">
</head>
<body>
  <div class="app-shell">
    <aside id="sidebar-root"></aside>
    <div class="main-area">
      <header id="navbar-root"></header>

      <main class="content">
        <div class="page-header" style="display:flex; justify-content:space-between; align-items:flex-end; gap:12px; flex-wrap:wrap;">
          <div>
            <h1 class="page-title">每月總開銷表</h1>
            <p class="page-subtitle" id="expenses-month">載入中…</p>
          </div>
          <button class="btn btn-magenta" id="export-pdf-btn">
            <i data-lucide="download"></i> 匯出 PDF
          </button>
        </div>

        <!-- ===== 全年模式 ===== -->
        <div id="annual-view" style="display:none;">
          <div class="grid grid-3" style="margin-bottom:20px;">
            <div class="glass-card">
              <div class="glass-card-title">年度總收入</div>
              <div class="glass-card-value emerald mono" id="annual-income">HK$ 0</div>
            </div>
            <div class="glass-card">
              <div class="glass-card-title">年度總支出</div>
              <div class="glass-card-value red mono" id="annual-expense">HK$ 0</div>
            </div>
            <div class="glass-card">
              <div class="glass-card-title">年度淨結餘</div>
              <div class="glass-card-value mono" id="annual-net">HK$ 0</div>
            </div>
          </div>
          <div id="annual-monthly-cards"></div>
        </div>

        <!-- ===== 單月模式 ===== -->
        <div id="monthly-view" style="display:none;">
          <div class="grid grid-3" style="margin-bottom:20px;">
            <div class="glass-card">
              <div class="glass-card-title">當月總收入</div>
              <div class="glass-card-value emerald mono" id="expenses-income">HK$ 0</div>
            </div>
            <div class="glass-card">
              <div class="glass-card-title">當月總支出</div>
              <div class="glass-card-value magenta mono" id="expenses-total">HK$ 0</div>
            </div>
            <div class="glass-card">
              <div class="glass-card-title">當月餘額</div>
              <div class="glass-card-value mono" id="expenses-balance">HK$ 0</div>
            </div>
          </div>

          <div class="grid grid-3" style="margin-bottom:20px;">
            <div class="glass-card">
              <div class="glass-card-title">家庭固定支出</div>
              <div class="glass-card-value orange mono" id="expenses-fixed-total">HK$ 0</div>
            </div>
          </div>

          <div id="member-sections"></div>

          <div class="glass-card" id="fixed-section" style="margin-top:20px;">
            <div class="glass-card-title" style="margin-bottom:12px;">家庭固定支出</div>
            <div style="overflow-x:auto;">
              <table class="data-table">
                <thead>
                  <tr>
                    <th>項目名稱</th>
                    <th>週期</th>
                    <th style="text-align:right;">金額</th>
                    <th>狀態</th>
                  </tr>
                </thead>
                <tbody id="fixed-tbody">
                  <tr><td colspan="4" class="empty-state">載入中…</td></tr>
                </tbody>
              </table>
            </div>
          </div>
        </div>
      </main>
    </div>
  </div>

  <script src="https://unpkg.com/lucide@latest"></script>
  <script type="module">
    import { initApp } from './js/app.js';
    import { initExpensesPage } from './js/expenses.js';

    await initApp({ activeHref: 'expenses.html', title: '每月總開銷表' });
    await initExpensesPage();
  </script>
</body>
</html>
