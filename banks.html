<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>銀行管理 | 家庭財務</title>
  <link rel="stylesheet" href="./css/theme.css">
  <link rel="stylesheet" href="./css/layout.css">
  <link rel="stylesheet" href="./css/components.css">
  <style>
    .collapsible-card { margin-bottom:16px; padding:0 !important; overflow:hidden; }
    .collapsible-header { display:flex; justify-content:space-between; align-items:center; padding:14px 20px; cursor:pointer; user-select:none; transition:background 0.2s ease; }
    .collapsible-header:hover { background:rgba(0,240,255,0.04); }
    .collapsible-header-title { display:flex; align-items:center; gap:10px; font-size:14px; font-weight:600; color:var(--neon-cyan); }
    .collapsible-arrow { color:var(--text-muted); transition:transform 0.25s ease; }
    .collapsible-card.open .collapsible-arrow { transform:rotate(180deg); }
    .collapsible-body { padding:0 20px 20px; border-top:1px solid rgba(255,255,255,0.05); padding-top:16px; }

    .merged-card { padding:0 !important; overflow:hidden; }
    .merged-toolbar { padding:14px 20px; border-bottom:1px solid rgba(255,255,255,0.06); background:rgba(0,240,255,0.02); }
    .merged-stats-area { padding:16px 20px; border-bottom:1px solid rgba(255,255,255,0.06); }
    .stats-grid { display:grid; grid-template-columns:repeat(2, 1fr); gap:16px; }
    .stat-item { padding:12px 16px; border:1px solid var(--glass-border); border-radius:var(--radius-md); background:rgba(8,11,17,0.4); }
    .stat-item .stat-label { font-size:11px; color:var(--text-muted); text-transform:uppercase; letter-spacing:1px; margin-bottom:6px; }
    .stat-item .stat-value { font-family:var(--font-mono); font-size:20px; font-weight:700; color:var(--neon-emerald); line-height:1.2; }
    .stat-item .stat-value.cyan { color:var(--neon-cyan); }
    .stat-item .stat-hint { font-size:11px; color:var(--text-muted); margin-top:4px; }

    .merged-table-area { padding:16px 20px 20px; }

    .toolbar-row { display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap; margin-bottom:14px; }

    .view-toggle-group { display:inline-flex; gap:4px; padding:3px; background:var(--glass-bg); border:1px solid var(--glass-border); border-radius:var(--radius-sm); }
    .view-toggle-group .btn { padding:5px 12px; font-size:12px; border:none; }

    .filter-bar { display:flex; gap:12px; align-items:flex-end; flex-wrap:wrap; }
    .filter-group { display:flex; flex-direction:column; gap:4px; min-width:100px; }
    .filter-group .field-label { font-size:11px; margin-bottom:0; }
    .filter-group .select { padding:6px 10px; font-size:13px; }

    .bank-table { width:100%; border-collapse:collapse; }
    .bank-table th, .bank-table td { white-space:nowrap; }
    .bank-table .bank-name-cell { font-size:13px; }
    .bank-table .prev-balance { color:var(--text-muted); }
    .bank-table .updated-at { font-size:11px; color:var(--text-muted); }

    .annual-month-card { margin-bottom:10px; padding:14px; border:1px solid var(--glass-border); border-radius:var(--radius-md); background:rgba(8,11,17,0.4); }
    .annual-month-header { display:flex; justify-content:space-between; align-items:center; cursor:pointer; user-select:none; }
    .annual-month-header .month-title { font-weight:700; font-size:15px; color:var(--neon-cyan); }
    .annual-month-header .month-total { font-family:var(--font-mono); font-weight:700; color:var(--neon-emerald); }
    .annual-month-detail { margin-top:12px; padding-top:12px; border-top:1px dashed rgba(255,255,255,0.1); }
    .annual-month-row { display:flex; justify-content:space-between; font-size:13px; padding:4px 0; }

    @media (max-width: 640px) {
      .collapsible-header { padding:12px 16px; }
      .collapsible-body { padding:0 16px 16px; padding-top:14px; }
      .merged-toolbar, .merged-stats-area, .merged-table-area { padding:14px 16px; }
      .stats-grid { grid-template-columns:1fr; gap:10px; }
      .stat-item { padding:10px 12px; }
      .stat-item .stat-value { font-size:16px; }
      .bank-table th, .bank-table td { padding:8px 5px; font-size:11px; }
      .bank-table .hide-mobile { display:none; }
      .bank-table .bank-name-cell { font-size:12px; }
      .bank-table .btn-sm { padding:3px 6px; font-size:10px; }
      .filter-bar { flex-direction:column; align-items:stretch; }
      .filter-group { min-width:auto; }
    }
  </style>
</head>
<body>
  <div class="app-shell">
    <aside id="sidebar-root"></aside>
    <div class="main-area">
      <header id="navbar-root"></header>

      <main class="content">
        <div class="page-header" style="display:flex; justify-content:space-between; align-items:flex-end; gap:12px; flex-wrap:wrap;">
          <div>
            <h1 class="page-title">銀行管理</h1>
            <p class="page-subtitle" id="banks-month">每月結餘錄入</p>
          </div>
          <div class="page-ym-selector">
            <select class="select" id="page-year"></select>
            <select class="select" id="page-month"></select>
          </div>
        </div>

        <!-- 可摺疊輸入表單 -->
        <div class="glass-card collapsible-card" id="bank-input-card">
          <div class="collapsible-header" id="bank-input-header">
            <div class="collapsible-header-title">
              <i data-lucide="plus-circle" style="width:16px;height:16px;"></i>
              <span>新增 / 更新結餘</span>
            </div>
            <i data-lucide="chevron-down" class="collapsible-arrow"></i>
          </div>
          <div class="collapsible-body" id="bank-input-body" style="display:none;">
            <form id="bank-form">
              <div class="grid grid-2" style="gap:12px;">
                <div class="field">
                  <label class="field-label" for="bank-form-year">所屬年份</label>
                  <select class="select" id="bank-form-year"></select>
                </div>
                <div class="field">
                  <label class="field-label" for="bank-form-month">所屬月份</label>
                  <select class="select" id="bank-form-month"></select>
                </div>
              </div>

              <div class="field">
                <label class="field-label" for="bank-select">銀行</label>
                <div style="display:flex; gap:8px;">
                  <select class="select" id="bank-select" required style="flex:1;">
                    <option value="">— 請選擇銀行 —</option>
                  </select>
                  <button type="button" class="btn btn-sm btn-ghost" id="add-bank-btn" style="padding:0 12px;" title="新增銀行">
                    <i data-lucide="plus" style="width:16px;height:16px;"></i>
                  </button>
                </div>
              </div>

              <div class="field">
                <label class="field-label" for="bank-amount">結餘金額（HK$）</label>
                <input class="input mono" id="bank-amount" type="number" min="0" step="1" required placeholder="0">
              </div>

              <div id="bank-form-hint" class="banner" style="display:none;"></div>

              <div style="display:flex; justify-content:flex-end; gap:10px; margin-top:12px;">
                <button type="button" class="btn btn-ghost" id="bank-reset-btn">重置</button>
                <button type="submit" class="btn btn-primary">
                  <i data-lucide="check"></i> 儲存結餘
                </button>
              </div>
            </form>
          </div>
        </div>

        <!-- 合併卡片 -->
        <div class="glass-card merged-card">
          <div class="merged-toolbar">
            <div class="toolbar-row">
              <div class="glass-card-title" style="margin:0;">
                銀行明細 <span class="text-muted" id="bank-count" style="font-size:12px;"></span>
              </div>
              <div class="view-toggle-group">
                <button class="btn btn-sm btn-ghost" id="view-month-btn">單月</button>
                <button class="btn btn-sm btn-primary" id="view-annual-btn">全年</button>
              </div>
            </div>
            <div class="filter-bar">
              <div class="filter-group">
                <label class="field-label" for="filter-year">年份</label>
                <select class="select" id="filter-year"></select>
              </div>
              <div class="filter-group">
                <label class="field-label" for="filter-month">月份</label>
                <select class="select" id="filter-month"></select>
              </div>
              <div class="filter-group">
                <label class="field-label" for="filter-bank">銀行</label>
                <select class="select" id="filter-bank"><option value="">全部</option></select>
              </div>
              <button class="btn btn-ghost btn-sm" id="filter-clear-btn">清除篩選</button>
            </div>
          </div>

          <div id="monthly-view">
            <div class="merged-stats-area">
              <div class="stats-grid">
                <div class="stat-item">
                  <div class="stat-label">本月銀行總結餘</div>
                  <div class="stat-value" id="bank-total">HK$ 0</div>
                </div>
                <div class="stat-item">
                  <div class="stat-label">當月可用金額</div>
                  <div class="stat-value cyan" id="bank-available">HK$ 0</div>
                  <div class="stat-hint">上月結餘 + 本月收入</div>
                </div>
              </div>
            </div>
            <div class="merged-table-area">
              <div style="overflow-x:auto;">
                <table class="data-table bank-table">
                  <thead>
                    <tr>
                      <th>銀行名稱</th>
                      <th class="num hide-mobile" style="width:130px;">上月結餘</th>
                      <th class="num" style="width:150px;">本月結餘（HK$）</th>
                      <th class="hide-mobile" style="width:150px;">最後更新</th>
                      <th style="width:90px;">操作</th>
                    </tr>
                  </thead>
                  <tbody id="bank-tbody">
                    <tr><td colspan="5" class="empty-state">載入中…</td></tr>
                  </tbody>
                </table>
              </div>
            </div>
          </div>

          <div id="annual-view" style="display:none;">
            <div class="merged-stats-area">
              <div class="stats-grid" style="grid-template-columns:1fr;">
                <div class="stat-item">
                  <div class="stat-label">年末銀行總結餘</div>
                  <div class="stat-value" id="annual-bank-total">HK$ 0</div>
                  <div class="stat-hint">以該年度最後一個有紀錄的月份為準</div>
                </div>
              </div>
            </div>
            <div class="merged-table-area">
              <div id="annual-monthly-cards"></div>
            </div>
          </div>
        </div>
      </main>
    </div>
  </div>

  <script src="https://unpkg.com/lucide@latest"></script>
  <script type="module">
    import { initApp } from './js/app.js';
    import { initBanksPage } from './js/banks.js';

    await initApp({ activeHref: 'banks.html', title: '銀行管理' });
    initBanksPage();
  </script>
</body>
</html>
