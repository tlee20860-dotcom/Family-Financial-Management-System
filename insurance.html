<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>保險付款 | 家庭財務</title>
  <link rel="stylesheet" href="./css/theme.css">
  <link rel="stylesheet" href="./css/layout.css">
  <link rel="stylesheet" href="./css/components.css">
</head>
<body>
  <div class="app-shell">
    <aside id="sidebar-root"></aside>
    <div class="main-area">
      <header id="navbar-root"></header>

      <main class="content">
        <div class="page-header" style="display:flex; justify-content:space-between; align-items:flex-end; gap:12px; flex-wrap:wrap;">
          <div>
            <h1 class="page-title">保險付款</h1>
            <p class="page-subtitle" id="insurance-month"></p>
          </div>
          <button class="btn btn-primary" id="add-policy-btn">
            <i data-lucide="plus"></i> 新增保單
          </button>
        </div>

        <div class="banner">
          ℹ️ 每張保單會依「開始日期」與「付款類型」自動產生每月分攤。請在對應月份勾選「已扣款」，系統會自動計算已供期數與保費。
        </div>

        <div class="grid grid-3" id="policy-grid">
          <div class="glass-card" style="grid-column:1/-1;">
            <div class="empty-state">載入中…</div>
          </div>
        </div>
      </main>
    </div>
  </div>

  <!-- Modal -->
  <div class="modal-overlay" id="policy-modal">
    <div class="modal" style="max-width:560px; max-height:90vh; overflow-y:auto;">
      <h2 class="modal-title" id="policy-modal-title">新增保單</h2>
      <form id="policy-form">
        <div class="field">
          <label class="field-label" for="policy-type">保單類型</label>
          <select class="select" id="policy-type">
            <option value="normal">普通保險（住院 / 人壽 / 意外）</option>
            <option value="fund_insurance">基金保險（投資型，月供）</option>
          </select>
        </div>

        <div class="field">
          <label class="field-label" for="policy-member">受保人</label>
          <select class="select" id="policy-member" required>
            <option value="">— 請選擇 —</option>
          </select>
        </div>

        <div class="field">
          <label class="field-label" for="policy-name">保險名稱</label>
          <input class="input" id="policy-name" required maxlength="60" placeholder="例如：危疾+住院">
        </div>

        <div class="field">
          <label class="field-label" for="policy-company">保險公司</label>
          <select class="select" id="policy-company">
            <option>富通</option><option>保誠</option><option>FWD</option>
            <option>AIA</option><option>宏利</option><option>AXA</option>
          </select>
        </div>

        <div class="grid grid-2" style="gap:12px;">
          <div class="field">
            <label class="field-label" for="policy-start">保險開始日期</label>
            <input class="input" id="policy-start" type="text" placeholder="例如：2026-06-01" required>
          </div>
          <div class="field">
            <label class="field-label" for="policy-payment-type">付款類型</label>
            <select class="select" id="policy-payment-type">
              <option value="年繳">年繳</option>
              <option value="月繳">月繳</option>
              <option value="一次付款">一次付款</option>
            </select>
          </div>
        </div>

        <!-- 普通保險：年繳 / 月繳 -->
        <div id="normal-fields">
          <div class="grid grid-2" style="gap:12px;">
            <div class="field">
              <label class="field-label" for="policy-annual">年繳保費（HK$）</label>
              <input class="input mono" id="policy-annual" type="number" min="0" step="0.01" placeholder="0">
            </div>
            <div class="field">
              <label class="field-label" for="policy-monthly">每月分攤（自動）</label>
              <input class="input mono" id="policy-monthly" disabled placeholder="自動計算">
            </div>
          </div>
          <div class="grid grid-2" style="gap:12px;">
            <div class="field">
              <label class="field-label" for="policy-total-periods">總期數</label>
              <input class="input mono" id="policy-total-periods" type="number" min="0" placeholder="12">
            </div>
            <div class="field">
              <label class="field-label" for="policy-completed-periods">已供期數（自動）</label>
              <input class="input mono" id="policy-completed-periods" type="number" disabled placeholder="0">
            </div>
          </div>
        </div>

        <!-- 基金保險專屬 -->
        <div id="fund-fields" style="display:none;">
          <div class="grid grid-2" style="gap:12px;">
            <div class="field">
              <label class="field-label" for="policy-monthly-premium">每月供款（HK$）</label>
              <input class="input mono" id="policy-monthly-premium" type="number" min="0" step="0.01" placeholder="2000">
            </div>
            <div class="field">
              <label class="field-label" for="policy-current-value">目前基金總值（HK$）</label>
              <input class="input mono" id="policy-current-value" type="number" min="0" step="0.01" placeholder="52000">
            </div>
          </div>
        </div>

        <div class="field">
          <label class="field-label" for="policy-account">扣款帳戶</label>
          <input class="input" id="policy-account" maxlength="60" placeholder="例如：年繳匯豐扣數">
        </div>

        <div class="field">
          <label style="display:flex; align-items:center; gap:8px; cursor:pointer; color:var(--text-secondary); font-size:13px;">
            <input type="checkbox" id="policy-completed" style="width:auto;">
            是否已供款完畢
          </label>
        </div>

        <div class="modal-actions">
          <button type="button" class="btn btn-ghost" id="policy-cancel-btn">取消</button>
          <button type="submit" class="btn btn-primary">儲存</button>
        </div>
      </form>
    </div>
  </div>

  <script src="https://unpkg.com/lucide@latest"></script>
  <script type="module">
    import { initApp } from './js/app.js';
    import { initInsurancePage } from './js/insurance.js';

    await initApp({ activeHref: 'insurance.html', title: '保險付款' });
    initInsurancePage();
  </script>
</body>
</html>
