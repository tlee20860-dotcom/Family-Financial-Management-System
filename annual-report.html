<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>年度報表 | 家庭財務</title>
  <link rel="stylesheet" href="./css/theme.css">
  <link rel="stylesheet" href="./css/layout.css">
  <link rel="stylesheet" href="./css/components.css">
  <style>
    .report-view-tabs {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }
    .annual-table-wrapper {
      overflow-x: auto;
      border: 1px solid var(--glass-border);
      border-radius: var(--radius-lg);
      background: var(--glass-bg);
      backdrop-filter: blur(var(--glass-blur));
    }
    .annual-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
      min-width: 800px;
    }
    .annual-table th, .annual-table td {
      padding: 10px 12px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      text-align: left;
    }
    .annual-table thead th {
      font-size: 11px;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .annual-table .num { text-align: right; font-family: var(--font-mono); }
    .annual-table tr:hover td { background: rgba(0, 240, 255, 0.03); }
    .annual-table .group-header td {
      background: rgba(0, 240, 255, 0.06);
      color: var(--neon-cyan);
      font-weight: 700;
    }
  </style>
</head>
<body>
  <div class="app-shell">
    <aside id="sidebar-root"></aside>
    <div class="main-area">
      <header id="navbar-root"></header>

      <main class="content">
        <div class="page-header" style="display:flex; justify-content:space-between; align-items:flex-end; gap:12px; flex-wrap:wrap;">
          <div>
            <h1 class="page-title">年度報表</h1>
            <p class="page-subtitle" id="annual-year">載入中…</p>
          </div>
          <div style="display:flex; gap:10px; flex-wrap:wrap;">
            <button class="btn btn-ghost" id="prev-year-btn">
              <i data-lucide="chevron-left"></i> 上一年
            </button>
            <button class="btn btn-ghost" id="next-year-btn">
              下一年 <i data-lucide="chevron-right"></i>
            </button>
            <button class="btn btn-magenta" id="export-excel-btn">
              <i data-lucide="file-spreadsheet"></i> 匯出 Excel
            </button>
          </div>
        </div>

        <!-- 年度統計卡 -->
        <div class="grid grid-3" style="margin-bottom:20px;">
          <div class="glass-card">
            <div class="glass-card-title">年度總收入</div>
            <div class="glass-card-value emerald mono" id="annual-income">HK$ 0</div>
          </div>
          <div class="glass-card">
            <div class="glass-card-title">年度總支出</div>
            <div class="glass-card-value red mono" id="annual-expense">HK$ 0</div>
          </div>
          <div class="glass-card">
            <div class="glass-card-title">年度淨結餘</div>
            <div class="glass-card-value mono" id="annual-balance">HK$ 0</div>
          </div>
        </div>

        <!-- 檢視切換 -->
        <div class="report-view-tabs">
          <button class="btn btn-primary" id="view-summary-btn">全年總合</button>
          <button class="btn btn-ghost" id="view-monthly-btn">按月明細</button>
        </div>

        <!-- 全年總合檢視 -->
        <div id="summary-view">
          <div class="glass-card">
            <div style="overflow-x:auto;">
              <table class="annual-table">
                <thead id="summary-thead"></thead>
                <tbody id="summary-tbody">
                  <tr><td colspan="8" class="empty-state">載入中…</td></tr>
                </tbody>
              </table>
            </div>
          </div>
        </div>

        <!-- 按月明細檢視 -->
        <div id="monthly-view" style="display:none;">
          <div class="annual-table-wrapper">
            <table class="annual-table">
              <thead>
                <tr>
                  <th class="col-item">項目</th>
                  <th>1月</th><th>2月</th><th>3月</th><th>4月</th><th>5月</th><th>6月</th>
                  <th>7月</th><th>8月</th><th>9月</th><th>10月</th><th>11月</th><th>12月</th>
                  <th>年度小計</th>
                </tr>
              </thead>
              <tbody id="monthly-tbody">
                <tr><td colspan="14" class="empty-state">載入中…</td></tr>
              </tbody>
            </table>
          </div>
        </div>
      </main>
    </div>
  </div>

<script src="https://unpkg.com/lucide@latest"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script type="module">
  import { initApp } from './js/app.js';
  import { initAnnualReportPage } from './js/annual-report.js';

  const user = await initApp({ activeHref: 'annual-report.html', title: '年度報表' });
  if (user) initAnnualReportPage();
</script>
</body>
</html>
