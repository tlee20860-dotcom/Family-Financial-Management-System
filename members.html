<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>成員管理 | 家庭財務</title>
  <link rel="stylesheet" href="./css/theme.css">
  <link rel="stylesheet" href="./css/layout.css">
  <link rel="stylesheet" href="./css/components.css">
</head>
<body>
  <div class="app-shell">
    <aside id="sidebar-root"></aside>
    <div class="main-area">
      <header id="navbar-root"></header>

      <main class="content">
        <div class="page-header" style="display:flex; justify-content:space-between; align-items:flex-end; gap:12px; flex-wrap:wrap;">
          <div>
            <h1 class="page-title">成員管理</h1>
            <p class="page-subtitle">新增、編輯、刪除家庭成員；可用箭頭調整顯示順序</p>
          </div>
          <button class="btn btn-primary" id="add-member-btn">
            <i data-lucide="plus"></i> 新增成員
          </button>
        </div>

        <div class="grid grid-4" id="members-grid">
          <div class="glass-card" style="grid-column:1/-1;">
            <div class="empty-state">載入中…</div>
          </div>
        </div>
      </main>
    </div>
  </div>

  <!-- Modal -->
  <div class="modal-overlay" id="member-modal">
    <div class="modal">
      <h2 class="modal-title" id="member-modal-title">新增成員</h2>
      <form id="member-form">
        <div class="field">
          <label class="field-label" for="member-name-input">名稱</label>
          <input class="input" id="member-name-input" required placeholder="例如：老公、梓舜" maxlength="20">
        </div>
        <div class="field">
          <label class="field-label" for="member-role-input">角色</label>
          <select class="select" id="member-role-input">
            <option value="husband">老公 / 丈夫</option>
            <option value="wife">老婆 / 妻子</option>
            <option value="child">子女</option>
            <option value="other" selected>其他</option>
          </select>
        </div>
        <div class="modal-actions">
          <button type="button" class="btn btn-ghost" id="member-cancel-btn">取消</button>
          <button type="submit" class="btn btn-primary">儲存</button>
        </div>
      </form>
    </div>
  </div>

  <script src="https://unpkg.com/lucide@latest"></script>
  <script type="module">
    import { initApp } from './js/app.js';
    import { initMembersPage } from './js/members.js';

    await initApp({ activeHref: 'members.html', title: '成員管理' });
    initMembersPage();
  </script>
</body>
</html>
