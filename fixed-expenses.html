<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>固定支出 | 家庭財務</title>
  <link rel="stylesheet" href="./css/theme.css">
  <link rel="stylesheet" href="./css/layout.css">
  <link rel="stylesheet" href="./css/components.css">
  <style>
    .fixed-card { margin-bottom: 16px; padding: 16px; }
    .fixed-card-header { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 12px; }
    .fixed-card-title { font-size: 15px; font-weight: 700; color: var(--neon-cyan); }
    .fixed-card-sub { font-size: 11px; color: var(--text-muted); margin-top: 2px; }
    .fixed-table { width: 100%; border-collapse: collapse; font-size: 13px; }
    .fixed-table th { text-align: left; padding: 6px 8px; color: var(--text-muted); font-size: 11px; border-bottom: 1px solid var(--glass-border); }
    .fixed-table td { padding: 6px 8px; border-bottom: 1px solid rgba(255, 255, 255, 0.04); }
    .fixed-table .num { text-align: right; font-family: var(--font-mono); }
    .fixed-table input[type="number"] { width: 100%; padding: 4px 8px; font-size: 12px; background: rgba(8, 11, 17, 0.6); border: 1px solid var(--glass-border); border-radius: var(--radius-sm); color: var(--text-primary); text-align: right; }
    .fixed-table input[type="number"]:focus { outline: none; border-color: var(--neon-cyan); }
    .fixed-table .month-label { font-family: var(--font-mono); font-size: 12px; color: var(--text-secondary); min-width: 50px; }
    .skip-row { opacity: 0.4; text-decoration: line-through; }
  </style>
</head>
<body>
  <div class="app-shell">
    <aside id="sidebar-root"></aside>
    <div class="main-area">
      <header id="navbar-root"></header>

      <main class="content">
        <div class="page-header" style="display:flex; justify-content:space-between; align-items:flex-end; gap:12px; flex-wrap:wrap;">
          <div>
            <h1 class="page-title">家庭固定支出</h1>
            <p class="page-subtitle" id="fixed-month"></p>
          </div>
          <button class="btn btn-primary" id="add-fixed-btn">
            <i data-lucide="plus"></i> 新增固定支出
          </button>
        </div>

        <div class="banner">
          ℹ️ 新增時只需輸入基本資料與週期，系統會自動分配到所屬月份。明細表可直接修改金額、勾選狀態或刪除。
        </div>

        <div id="fixed-templates-container">
          <div class="glass-card"><div class="empty-state">載入中…</div></div>
        </div>
      </main>
    </div>
  </div>

  <!-- 新增固定支出 Modal -->
  <div class="modal-overlay" id="fixed-modal">
    <div class="modal" style="max-width:520px;">
      <h2 class="modal-title" id="fixed-modal-title">新增固定支出</h2>
      <form id="fixed-form">
        <div class="field">
          <label class="field-label" for="fixed-member">所屬成員</label>
          <select class="select" id="fixed-member">
            <option value="shared">家庭共用支出</option>
          </select>
        </div>
        <div class="field">
          <label class="field-label" for="fixed-category">支出類別</label>
          <select class="select" id="fixed-category" required>
            <option value="">— 請選擇類別 —</option>
          </select>
        </div>
        <div class="field">
          <label class="field-label" for="fixed-item">項目</label>
          <div style="display:flex; gap:8px;">
            <select class="select" id="fixed-item" required style="flex:1;">
              <option value="">— 請先選擇類別 —</option>
            </select>
            <button type="button" class="btn btn-sm btn-ghost" id="add-fixed-item-btn" title="新增項目" style="padding:0 12px;">
              <i data-lucide="plus" style="width:16px;height:16px;"></i>
            </button>
          </div>
        </div>
        <div class="field">
          <label class="field-label" for="fixed-cycle">付款週期</label>
          <select class="select" id="fixed-cycle">
            <option value="每月">每月</option>
            <option value="每2個月">每2個月</option>
            <option value="每季">每季</option>
            <option value="每年">每年</option>
            <option value="一次性">一次性</option>
          </select>
        </div>
        <div class="field">
          <label class="field-label" for="fixed-amount">每月金額（HK$）</label>
          <input class="input mono" id="fixed-amount" type="number" min="0" step="0.01" required placeholder="0">
        </div>
        <div class="field">
          <label class="field-label" for="fixed-note">備註（可選）</label>
          <input class="input" id="fixed-note" maxlength="60" placeholder="例如：每期調整">
        </div>
        <div class="modal-actions">
          <button type="button" class="btn btn-ghost" id="fixed-cancel-btn">取消</button>
          <button type="submit" class="btn btn-primary">新增並分配到各月</button>
        </div>
      </form>
    </div>
  </div>

  <script src="https://unpkg.com/lucide@latest"></script>
  <script type="module">
    import { initApp } from './js/app.js';
    import { initFixedExpensesPage } from './js/fixed-expenses.js';

    await initApp({ activeHref: 'fixed-expenses.html', title: '家庭固定支出' });
    initFixedExpensesPage();
  </script>
</body>
</html>
