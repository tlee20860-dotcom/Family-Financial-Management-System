<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>固定支出 | 家庭財務</title>
  <link rel="stylesheet" href="./css/theme.css">
  <link rel="stylesheet" href="./css/layout.css">
  <link rel="stylesheet" href="./css/components.css">
</head>
<body>
  <div class="app-shell">
    <aside id="sidebar-root"></aside>
    <div class="main-area">
      <header id="navbar-root"></header>

      <main class="content">
        <div class="page-header" style="display:flex; justify-content:space-between; align-items:flex-end; gap:12px; flex-wrap:wrap;">
          <div>
            <h1 class="page-title">家庭固定支出</h1>
            <p class="page-subtitle" id="fixed-month"></p>
          </div>
          <div style="display:flex; gap:10px; flex-wrap:wrap; align-items:center;">
            <div class="view-toggle-group">
              <button class="btn btn-sm btn-primary" id="view-card-btn">卡片模式</button>
              <button class="btn btn-sm btn-ghost" id="view-table-btn">表格模式</button>
            </div>
          </div>
        </div>

        <div id="page-filter-root" style="margin-bottom:16px;"></div>

        <!-- 🆕 v99：摺疊輸入表單容器 -->
        <div id="fixed-input-root" style="margin-bottom:16px;"></div>

        <div class="banner">
          ℹ️ 新增時只需輸入基本資料與週期，系統會自動分配到所屬月份。點擊「展開明細」可直接編輯每月金額與付款狀態。
        </div>

        <div id="fixed-templates-container"></div>
      </main>
    </div>
  </div>

  <script src="https://unpkg.com/lucide@latest"></script>
  <script type="module">
    import { initApp } from './js/app.js';
    import { initFixedExpensesPage } from './js/fixed-expenses.js';

    await initApp({ activeHref: 'fixed-expenses.html', title: '家庭固定支出' });
    initFixedExpensesPage();
  </script>
</body>
</html>
