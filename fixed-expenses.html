<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>固定支出 | 家庭財務</title>
  <link rel="stylesheet" href="./css/theme.css">
  <link rel="stylesheet" href="./css/layout.css">
  <link rel="stylesheet" href="./css/components.css">
</head>
<body>
  <div class="app-shell">
    <aside id="sidebar-root"></aside>
    <div class="main-area">
      <header id="navbar-root"></header>

      <main class="content">
        <div class="page-header" style="display:flex; justify-content:space-between; align-items:flex-end; gap:12px; flex-wrap:wrap;">
          <div>
            <h1 class="page-title">家庭固定支出</h1>
            <p class="page-subtitle" id="fixed-month"></p>
          </div>
          <div style="display:flex; gap:10px; flex-wrap:wrap; align-items:center;">
            <div class="page-ym-selector">
              <select class="select" id="page-year"></select>
              <select class="select" id="page-month"></select>
            </div>
            <div class="view-toggle-group">
              <button class="btn btn-sm btn-primary" id="view-card-btn">卡片模式</button>
              <button class="btn btn-sm btn-ghost" id="view-table-btn">表格模式</button>
            </div>
            <button class="btn btn-primary" id="add-fixed-btn">
              <i data-lucide="plus"></i> 新增固定支出
            </button>
          </div>
        </div>

        <div class="banner">
          ℹ️ 新增時只需輸入基本資料與週期，系統會自動分配到所屬月份。點擊「展開明細」可直接編輯每月金額與付款狀態。
        </div>

        <div id="fixed-templates-container"></div>
      </main>
    </div>
  </div>

  <!-- 新增固定支出 Modal -->
  <div class="modal-overlay" id="fixed-modal">
    <div class="modal" style="max-width:520px;">
      <h2 class="modal-title">新增固定支出</h2>
      <form id="fixed-form">
        <div class="field">
          <label class="field-label" for="fixed-member">所屬成員</label>
          <select class="select" id="fixed-member">
            <option value="shared">家庭共用支出</option>
          </select>
        </div>
        <div class="field">
          <label class="field-label" for="fixed-category">支出類別</label>
          <select class="select" id="fixed-category" required><option value="">— 請選擇類別 —</option></select>
        </div>
        <div class="field">
          <label class="field-label" for="fixed-item">項目</label>
          <div style="display:flex; gap:8px;">
            <select class="select" id="fixed-item" required style="flex:1;"><option value="">— 請先選擇類別 —</option></select>
            <button type="button" class="btn btn-sm btn-ghost" id="add-fixed-item-btn" style="padding:0 12px;"><i data-lucide="plus" style="width:16px;height:16px;"></i></button>
          </div>
        </div>
        <div class="field">
          <label class="field-label" for="fixed-cycle">付款週期</label>
          <select class="select" id="fixed-cycle">
            <option value="每月">每月</option>
            <option value="每2個月">每2個月</option>
            <option value="每季">每季</option>
            <option value="每年">每年</option>
            <option value="一次性">一次性</option>
          </select>
        </div>
        <div class="field">
          <label class="field-label" for="fixed-payment">支付方式</label>
          <select class="select" id="fixed-payment">
            <option value="">— 請選擇 —</option>
          </select>
        </div>
        <div class="field"><label class="field-label" for="fixed-amount">每月金額（HK$）</label><input class="input mono" id="fixed-amount" type="number" min="0" step="1" required></div>
        <div class="field"><label class="field-label" for="fixed-note">備註（可選）</label><input class="input" id="fixed-note" maxlength="60"></div>
        <div class="modal-actions">
          <button type="button" class="btn btn-ghost" id="fixed-cancel-btn">取消</button>
          <button type="submit" class="btn btn-primary">新增並分配到各月</button>
        </div>
      </form>
    </div>
  </div>

  <script src="https://unpkg.com/lucide@latest"></script>
  <script type="module">
    import { initApp } from './js/app.js';
    import { initFixedExpensesPage } from './js/fixed-expenses.js';

    await initApp({ activeHref: 'fixed-expenses.html', title: '家庭固定支出' });
    initFixedExpensesPage();
  </script>
</body>
</html>
