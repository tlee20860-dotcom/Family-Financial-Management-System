<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>基金投資 | 家庭財務</title>
  <link rel="stylesheet" href="./css/theme.css">
  <link rel="stylesheet" href="./css/layout.css">
  <link rel="stylesheet" href="./css/components.css">
</head>
<body>
  <div class="app-shell">
    <aside id="sidebar-root"></aside>
    <div class="main-area">
      <header id="navbar-root"></header>

      <main class="content">
        <div class="page-header" style="display:flex; justify-content:space-between; align-items:flex-end; gap:12px; flex-wrap:wrap;">
          <div>
            <h1 class="page-title">基金投資資產</h1>
            <p class="page-subtitle">基金持倉與最新現值</p>
          </div>
          <button class="btn btn-primary" id="add-fund-btn">
            <i data-lucide="plus"></i> 新增基金
          </button>
        </div>

        <!-- 統計卡 -->
        <div class="grid grid-3" style="margin-bottom:20px;">
          <div class="glass-card">
            <div class="glass-card-title">總投入成本</div>
            <div class="glass-card-value mono" id="stat-fund-cost">HK$ 0</div>
          </div>
          <div class="glass-card">
            <div class="glass-card-title">總現時價值</div>
            <div class="glass-card-value emerald mono" id="stat-fund-value">HK$ 0</div>
          </div>
          <div class="glass-card">
            <div class="glass-card-title">總帳面盈虧</div>
            <div class="glass-card-value mono" id="stat-fund-pnl">HK$ 0</div>
          </div>
        </div>

        <!-- 基金卡片 -->
        <div class="grid grid-3" id="fund-grid">
          <div class="glass-card" style="grid-column:1/-1;">
            <div class="empty-state">載入中…</div>
          </div>
        </div>
      </main>
    </div>
  </div>

  <!-- Modal -->
  <div class="modal-overlay" id="fund-modal">
    <div class="modal" style="max-width:520px;">
      <h2 class="modal-title" id="fund-modal-title">新增基金</h2>
      <form id="fund-form">
        <div class="field">
          <label class="field-label" for="fund-name">基金名稱</label>
          <input class="input" id="fund-name" required placeholder="例如：富達環球股票基金" maxlength="60">
        </div>

        <div class="grid grid-2" style="gap:12px;">
          <div class="field">
            <label class="field-label" for="fund-cost">投入成本（HK$）</label>
            <input class="input mono" id="fund-cost" type="number" min="0" step="0.01" required placeholder="0">
          </div>
          <div class="field">
            <label class="field-label" for="fund-value">現時價值（HK$）</label>
            <input class="input mono" id="fund-value" type="number" min="0" step="0.01" required placeholder="0">
          </div>
        </div>

        <div class="field">
          <label class="field-label" for="fund-units">持有單位數（可選）</label>
          <input class="input mono" id="fund-units" type="number" min="0" step="0.0001" placeholder="例如：123.4567">
        </div>

        <div class="field">
          <label class="field-label" for="fund-note">備註（可選）</label>
          <input class="input" id="fund-note" placeholder="例如：月供計劃" maxlength="60">
        </div>

        <div class="modal-actions">
          <button type="button" class="btn btn-ghost" id="fund-cancel-btn">取消</button>
          <button type="submit" class="btn btn-primary">儲存</button>
        </div>
      </form>
    </div>
  </div>

  <script src="https://unpkg.com/lucide@latest"></script>
  <script type="module">
    import { initApp } from './js/app.js';
    import { initPortfolioPage } from './js/portfolio.js';

    await initApp({ activeHref: 'portfolio.html', title: '基金投資資產' });
    initPortfolioPage();
  </script>
</body>
</html>
