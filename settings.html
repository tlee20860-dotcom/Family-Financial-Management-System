<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>系統設定 | 家庭財務</title>
  <link rel="stylesheet" href="./css/theme.css">
  <link rel="stylesheet" href="./css/layout.css">
  <link rel="stylesheet" href="./css/components.css">
</head>
<body>
  <div class="app-shell">
    <aside id="sidebar-root"></aside>
    <div class="main-area">
      <header id="navbar-root"></header>

      <main class="content">
        <div class="page-header">
          <h1 class="page-title">系統設定</h1>
          <p class="page-subtitle">帳號與偏好設定</p>
        </div>

        <div class="glass-card" style="max-width:520px;">
          <div class="field">
            <label class="field-label">登入帳號</label>
            <input class="input mono" id="settings-account" value="載入中…" disabled>
          </div>
          <div class="field">
            <label class="field-label">角色</label>
            <input class="input mono" value="超級管理員" disabled>
          </div>

          <button class="btn btn-danger" id="logout-btn">登出</button>
        </div>
      </main>
    </div>
  </div>

  <script src="https://unpkg.com/lucide@latest"></script>
  <script type="module">
    import { initApp } from './js/app.js';
    import { getDisplayName, logout } from './js/auth.js';

    const user = await initApp({ activeHref: 'settings.html', title: '系統設定' });

    if (user) {
      document.getElementById('settings-account').value = getDisplayName(user);
    }

    document.getElementById('logout-btn').addEventListener('click', () => {
      if (confirm('確定要登出嗎？')) logout();
    });
  </script>
</body>
</html>
