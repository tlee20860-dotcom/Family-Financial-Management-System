<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>系統設定 | 家庭財務</title>
  <link rel="stylesheet" href="./css/theme.css">
  <link rel="stylesheet" href="./css/layout.css">
  <link rel="stylesheet" href="./css/components.css">
</head>
<body>
  <div class="app-shell">
    <aside id="sidebar-root"></aside>
    <div class="main-area">
      <header id="navbar-root"></header>

      <main class="content">
        <div class="page-header">
          <h1 class="page-title">系統設定</h1>
          <p class="page-subtitle">帳號與資產設定</p>
        </div>

        <div class="glass-card" style="max-width:520px; margin-bottom:20px;">
          <div class="glass-card-title">帳號資訊</div>
          <div class="field">
            <label class="field-label">登入帳號</label>
            <input class="input mono" id="settings-account" value="載入中…" disabled>
          </div>
          <div class="field">
            <label class="field-label">角色</label>
            <input class="input mono" value="超級管理員" disabled>
          </div>
          <button class="btn btn-danger" id="logout-btn">登出</button>
        </div>

        <div class="glass-card" style="max-width:520px;">
          <div class="glass-card-title">家庭資產</div>
          <p class="glass-card-hint" style="margin-bottom:14px;">
            銀行戶口結餘將計入「家庭總資產」。<br>
            基金現值請至「基金投資」頁面管理。
          </p>
          <form id="asset-form">
            <div class="field">
              <label class="field-label" for="asset-bank">銀行戶口結餘（HK$）</label>
              <input class="input mono" id="asset-bank" type="number" min="0" step="0.01" placeholder="0">
            </div>
            <div class="field">
              <label class="field-label">基金現值總計（自動）</label>
              <input class="input mono" id="asset-fund-value" value="HK$ 0" disabled>
            </div>
            <div class="banner" id="asset-status" style="display:none; margin-bottom:14px;"></div>
            <button type="submit" class="btn btn-primary">儲存銀行結餘</button>
          </form>
        </div>
      </main>
    </div>
  </div>

  <script src="https://unpkg.com/lucide@latest"></script>
  <script type="module">
    import { initApp } from './js/app.js';
    import { getDisplayName, logout } from './js/auth.js';
    import { initSettingsPage } from './js/settings.js';
    import { listenFunds } from './js/db.js';
    import { formatHKD } from './js/utils.js';

    const user = await initApp({ activeHref: 'settings.html', title: '系統設定' });

    if (user) {
      document.getElementById('settings-account').value = getDisplayName(user);
    }

    document.getElementById('logout-btn').addEventListener('click', () => {
      if (confirm('確定要登出嗎？')) logout();
    });

    initSettingsPage();

    listenFunds((funds) => {
      const total = funds.reduce((s, f) => s + (Number(f.currentValue) || 0), 0);
      const el = document.getElementById('asset-fund-value');
      if (el) el.value = formatHKD(total);
    });
  </script>
</body>
</html>
