<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>系統設定 | 家庭財務</title>
  <link rel="stylesheet" href="./css/theme.css">
  <link rel="stylesheet" href="./css/layout.css">
  <link rel="stylesheet" href="./css/components.css">
</head>
<body>
  <div class="app-shell">
    <aside id="sidebar-root"></aside>
    <div class="main-area">
      <header id="navbar-root"></header>

      <main class="content">
        <div class="page-header">
          <h1 class="page-title">系統設定</h1>
          <p class="page-subtitle">帳號資訊與個人化設定</p>
        </div>

        <!-- 帳號資訊 -->
        <div class="glass-card" style="max-width:520px; margin-bottom:16px;">
          <div class="glass-card-title">帳號資訊</div>
          <div class="field">
            <label class="field-label">登入帳號</label>
            <input class="input mono" id="settings-account" value="載入中…" disabled>
          </div>
          <div class="field">
            <label class="field-label">角色</label>
            <input class="input mono" value="超級管理員" disabled>
          </div>
          <button class="btn btn-danger" id="logout-btn">登出</button>
        </div>

        <!-- 🆕 v99：側邊欄排序 -->
        <div class="glass-card" style="max-width:640px;">
          <div class="glass-card-title">側邊欄排序</div>
          <p class="glass-card-hint" style="margin-bottom:16px;">
            調整下方功能選單的顯示順序（排序同步至雲端，跨裝置生效）
          </p>
          <div id="sidebar-order-list"></div>
          <div style="margin-top:16px; text-align:right;">
            <button class="btn btn-ghost btn-sm" id="reset-sidebar-order-btn">
              <i data-lucide="rotate-ccw" style="width:14px;height:14px;"></i>
              重置為預設
            </button>
          </div>
        </div>
      </main>
    </div>
  </div>

  <script src="https://unpkg.com/lucide@latest"></script>
  <script type="module">
    import { initApp } from './js/app.js';
    import { getDisplayName, logout } from './js/auth.js';
    import { initSettingsPage } from './js/settings.js';

    const user = await initApp({ activeHref: 'settings.html', title: '系統設定' });

    if (user) {
      document.getElementById('settings-account').value = getDisplayName(user);
    }

    document.getElementById('logout-btn').addEventListener('click', () => {
      if (confirm('確定要登出嗎？')) logout();
    });

    initSettingsPage();
  </script>
</body>
</html>
