<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>平台管理 | 家庭財務</title>
  <link rel="stylesheet" href="./css/theme.css">
  <link rel="stylesheet" href="./css/layout.css">
  <link rel="stylesheet" href="./css/components.css">
</head>
<body>
  <div class="app-shell">
    <aside id="sidebar-root" style="display:none;"></aside>
    <div class="main-area" style="width:100%;">
      <header id="navbar-root"></header>

      <main class="content">
        <div class="page-header" style="display:flex; justify-content:space-between; align-items:flex-end; gap:12px; flex-wrap:wrap;">
          <div>
            <h1 class="page-title">平台管理</h1>
            <p class="page-subtitle">管理所有家庭帳號</p>
          </div>
          <button class="btn btn-danger" id="logout-btn">登出</button>
        </div>

        <div id="admin-error" class="banner banner-magenta" style="display:none;"></div>

        <!-- 🆕 v99：摺疊輸入表單容器 -->
        <div id="family-input-root" style="margin-bottom:16px;"></div>

        <div class="glass-card">
          <div style="overflow-x:auto;">
            <table class="data-table">
              <thead>
                <tr>
                  <th>家庭名稱</th>
                  <th>擁有者 Email</th>
                  <th>UID</th>
                  <th>建立時間</th>
                  <th>操作</th>
                </tr>
              </thead>
              <tbody id="family-tbody">
                <tr><td colspan="5" class="empty-state">載入中…</td></tr>
              </tbody>
            </table>
          </div>
        </div>
      </main>
    </div>
  </div>

  <script src="https://unpkg.com/lucide@latest"></script>
  <script type="module">
    import { AppState } from './js/state.js';
    import { initAdminPage } from './js/admin.js';
    import { watchAuth, isSuperAdmin } from './js/auth.js';
    import { initPWA } from './js/pwa.js';

    AppState.init();
    initPWA();

    watchAuth((user) => {
      if (!user) {
        window.location.href = 'login.html';
        return;
      }
      AppState.setUser(user);
      AppState.setSuperAdmin(isSuperAdmin(user));
      initAdminPage();
    });
  </script>
</body>
</html>
