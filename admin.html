<!DOCTYPE html>
<html lang="zh-Hant">
  <script src="https://cdn.jsdelivr.net/npm/eruda"></script>
<script>eruda.init();</script>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>平台管理 | 家庭財務</title>
  <link rel="stylesheet" href="./css/theme.css">
  <link rel="stylesheet" href="./css/layout.css">
  <link rel="stylesheet" href="./css/components.css">
</head>
<body>
  <div class="app-shell">
    <aside id="sidebar-root" style="display:none;"></aside>
    <div class="main-area" style="width:100%;">
      <header id="navbar-root"></header>

      <main class="content">
        <div class="page-header" style="display:flex; justify-content:space-between; align-items:flex-end; gap:12px; flex-wrap:wrap;">
          <div>
            <h1 class="page-title">平台管理</h1>
            <p class="page-subtitle">管理所有家庭帳號</p>
          </div>
          <div style="display:flex; gap:10px;">
            <button class="btn btn-primary" id="add-family-btn">
              <i data-lucide="plus"></i> 新增家庭
            </button>
            <button class="btn btn-danger" id="logout-btn">登出</button>
          </div>
        </div>

        <div id="admin-error" class="banner banner-magenta" style="display:none;"></div>

        <div class="glass-card">
          <div style="overflow-x:auto;">
            <table class="data-table">
              <thead>
                <tr>
                  <th>家庭名稱</th>
                  <th>擁有者 Email</th>
                  <th>UID</th>
                  <th>建立時間</th>
                  <th>操作</th>
                </tr>
              </thead>
              <tbody id="family-tbody">
                <tr><td colspan="5" class="empty-state">載入中…</td></tr>
              </tbody>
            </table>
          </div>
        </div>
      </main>
    </div>
  </div>

  <!-- 新增家庭 Modal -->
  <div class="modal-overlay" id="family-modal">
    <div class="modal">
      <h2 class="modal-title">新增家庭</h2>
      <form id="family-form">
        <div class="field">
          <label class="field-label" for="family-uid">Firebase UID</label>
          <input class="input mono" id="family-uid" required maxlength="60" placeholder="在 Firebase Auth 建立後複製 UID">
          <div class="glass-card-hint">請先在 Firebase 控制台建立家庭帳號，再將 UID 貼上。</div>
        </div>
        <div class="field">
          <label class="field-label" for="family-name">家庭名稱</label>
          <input class="input" id="family-name" required maxlength="30" placeholder="例如：陳家">
        </div>
        <div class="field">
          <label class="field-label" for="family-email">擁有者 Email（可選）</label>
          <input class="input" id="family-email" maxlength="60" placeholder="例如：chen@familyfin.local">
        </div>
        <div class="modal-actions">
          <button type="button" class="btn btn-ghost" id="family-cancel-btn">取消</button>
          <button type="submit" class="btn btn-primary">儲存</button>
        </div>
      </form>
    </div>
  </div>

  <script src="https://unpkg.com/lucide@latest"></script>
<script type="module">
  import { AppState } from './js/state.js';
  import { initAdminPage } from './js/admin.js';
  import { watchAuth, isSuperAdmin } from './js/auth.js';
  import { initPWA } from './js/pwa.js';

  AppState.init();
  initPWA();

  // 監聽登入狀態，確認是 superadmin 後才初始化管理頁面
  watchAuth((user) => {
    if (!user) {
      window.location.href = 'login.html';
      return;
    }
    AppState.setUser(user);
    AppState.setSuperAdmin(isSuperAdmin(user));
    initAdminPage();
  });
</script>
</body>
</html>
