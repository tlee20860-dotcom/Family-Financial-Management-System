<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>結算清單 | 家庭財務</title>
  <link rel="stylesheet" href="./css/theme.css">
  <link rel="stylesheet" href="./css/layout.css">
  <link rel="stylesheet" href="./css/components.css">
</head>
<body>
  <div class="app-shell">
    <aside id="sidebar-root"></aside>
    <div class="main-area">
      <header id="navbar-root"></header>

      <main class="content">
        <div class="page-header" style="display:flex; justify-content:space-between; align-items:flex-end; gap:12px; flex-wrap:wrap;">
          <div>
            <h1 class="page-title">結算清單</h1>
            <p class="page-subtitle" id="settlement-month"></p>
          </div>
          <div style="text-align:right;">
            <div class="glass-card-title" style="margin:0;">本期待還款總額</div>
            <div class="mono text-magenta" id="settlement-pending-total" style="font-size:24px; font-weight:700;">HK$ 0</div>
          </div>
        </div>

        <div id="page-filter-root" style="margin-bottom:16px;"></div>

        <div id="repayment-input-root" style="margin-bottom:16px;"></div>

        <div id="annual-view" style="display:none;">
          <div id="annual-monthly-cards"></div>
        </div>

        <div id="monthly-view" style="display:none;">
          <!-- 固定還款（表格折疊） -->
          <div class="glass-card collapsible-card collapsible-card-flat" id="fixed-repayment-table-card" style="margin-bottom:20px;">
            <div class="collapsible-header" id="fixed-repayment-table-header">
              <div class="collapsible-header-title">
                <i data-lucide="repeat" style="width:16px;height:16px;"></i>
                <span>每月固定還款項目</span>
              </div>
              <i data-lucide="chevron-down" class="collapsible-arrow"></i>
            </div>
            <div class="collapsible-body" id="fixed-repayment-table-body" style="display:none;">
              <div style="overflow-x:auto;">
                <table class="data-table">
                  <thead>
                    <tr>
                      <th>成員</th>
                      <th>項目名稱</th>
                      <th style="text-align:right;">金額</th>
                      <th>狀態</th>
                      <th>已轉回</th>
                      <th>操作</th>
                    </tr>
                  </thead>
                  <tbody id="fixed-repayment-tbody">
                    <tr><td colspan="6" class="empty-state">載入中…</td></tr>
                  </tbody>
                </table>
              </div>
            </div>
          </div>

          <!-- 成員代墊（表格折疊） -->
          <div class="glass-card collapsible-card collapsible-card-flat" id="member-repayment-table-card">
            <div class="collapsible-header" id="member-repayment-table-header">
              <div class="collapsible-header-title">
                <i data-lucide="users" style="width:16px;height:16px;"></i>
                <span>本月成員代墊支出</span>
              </div>
              <i data-lucide="chevron-down" class="collapsible-arrow"></i>
            </div>
            <div class="collapsible-body" id="member-repayment-table-body" style="display:none;">
              <div style="overflow-x:auto;">
                <table class="data-table">
                  <thead>
                    <tr>
                      <th>成員</th>
                      <th>項目名稱</th>
                      <th style="text-align:right;">金額</th>
                      <th>日期</th>
                      <th>狀態</th>
                      <th>已轉回</th>
                      <th>操作</th>
                    </tr>
                  </thead>
                  <tbody id="member-repayment-tbody">
                    <tr><td colspan="7" class="empty-state">載入中…</td></tr>
                  </tbody>
                </table>
              </div>
            </div>
          </div>
        </div>
      </main>
    </div>
  </div>

  <!-- 編輯代墊支出 Modal -->
  <div class="modal-overlay" id="edit-expense-modal">
    <div class="modal">
      <h2 class="modal-title">修改支出內容</h2>
      <form id="edit-expense-form">
        <input type="hidden" id="edit-member-id">
        <input type="hidden" id="edit-expense-id">
        <input type="hidden" id="edit-expense-year">
        <input type="hidden" id="edit-expense-month">
        <div class="form-stack">
          <div class="field">
            <label class="field-label" for="edit-expense-name">項目名稱</label>
            <input class="input" id="edit-expense-name" required maxlength="60">
          </div>
          <div class="field">
            <label class="field-label" for="edit-expense-amount">金額（HK$）</label>
            <input class="input mono" id="edit-expense-amount" type="number" min="0" step="1" required>
          </div>
          <div class="field">
            <label class="field-label" for="edit-expense-date">日期</label>
            <input class="input" id="edit-expense-date" type="text" placeholder="例如：2026-10-03">
          </div>
          <div class="field">
            <label class="field-label" for="edit-expense-status">狀態</label>
            <select class="select" id="edit-expense-status">
              <option value="未處理">未處理</option>
              <option value="已處理">已處理</option>
              <option value="未還款">未還款</option>
              <option value="已還款">已還款</option>
            </select>
          </div>
        </div>
        <div class="modal-actions">
          <button type="button" class="btn btn-ghost" id="edit-expense-cancel-btn">取消</button>
          <button type="submit" class="btn btn-primary">儲存</button>
        </div>
      </form>
    </div>
  </div>

  <script src="https://unpkg.com/lucide@latest"></script>
  <script type="module">
    import { initApp } from './js/app.js';
    import { initSettlementsPage } from './js/settlements.js';

    await initApp({ activeHref: 'settlements.html', title: '結算清單' });
    initSettlementsPage();
  </script>
</body>
</html>
