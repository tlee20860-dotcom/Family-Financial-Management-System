<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>基礎資料管理庫 | 家庭財務</title>
  <link rel="stylesheet" href="./css/theme.css">
  <link rel="stylesheet" href="./css/layout.css">
  <link rel="stylesheet" href="./css/components.css">
  <style>
    .data-blocks {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
    }
    @media (max-width: 1024px) {
      .data-blocks { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="app-shell">
    <aside id="sidebar-root"></aside>
    <div class="main-area">
      <header id="navbar-root"></header>

      <main class="content">
        <div class="page-header">
          <h1 class="page-title">基礎資料管理庫</h1>
          <p class="page-subtitle">管理支出類別、項目與支付方式，支出輸入時可直接選用</p>
        </div>

        <div class="data-blocks">
          <!-- 支出類別 -->
          <div>
            <div id="category-input-root"></div>

            <div class="glass-card collapsible-card collapsible-card-flat" id="cat-table-card">
              <div class="collapsible-header" id="cat-table-header">
                <div class="collapsible-header-title">
                  <i data-lucide="tags" style="width:16px;height:16px;"></i>
                  <span>支出類別</span>
                </div>
                <i data-lucide="chevron-down" class="collapsible-arrow"></i>
              </div>
              <div class="collapsible-body" id="cat-table-body" style="display:none;">
                <table class="data-table">
                  <thead>
                    <tr>
                      <th>名稱</th>
                      <th style="text-align:right;">排序</th>
                      <th>操作</th>
                    </tr>
                  </thead>
                  <tbody id="category-tbody">
                    <tr><td colspan="3" class="empty-state">載入中…</td></tr>
                  </tbody>
                </table>
              </div>
            </div>
          </div>

          <!-- 支出項目 -->
          <div>
            <div id="item-input-root"></div>

            <div class="glass-card collapsible-card collapsible-card-flat" id="item-table-card">
              <div class="collapsible-header" id="item-table-header">
                <div class="collapsible-header-title">
                  <i data-lucide="list" style="width:16px;height:16px;"></i>
                  <span>支出項目</span>
                </div>
                <div style="display:flex; align-items:center; gap:10px;">
                  <select class="select" id="filter-category" style="width:auto; padding:4px 8px; font-size:12px;" onclick="event.stopPropagation()">
                    <option value="">全部分類</option>
                  </select>
                  <i data-lucide="chevron-down" class="collapsible-arrow"></i>
                </div>
              </div>
              <div class="collapsible-body" id="item-table-body" style="display:none;">
                <table class="data-table">
                  <thead>
                    <tr>
                      <th>名稱</th>
                      <th>所屬類別</th>
                      <th>操作</th>
                    </tr>
                  </thead>
                  <tbody id="item-tbody">
                    <tr><td colspan="3" class="empty-state">載入中…</td></tr>
                  </tbody>
                </table>
              </div>
            </div>
          </div>

          <!-- 支付方式 -->
          <div>
            <div id="payment-input-root"></div>

            <div class="glass-card collapsible-card collapsible-card-flat" id="payment-table-card">
              <div class="collapsible-header" id="payment-table-header">
                <div class="collapsible-header-title">
                  <i data-lucide="credit-card" style="width:16px;height:16px;"></i>
                  <span>支付方式</span>
                </div>
                <i data-lucide="chevron-down" class="collapsible-arrow"></i>
              </div>
              <div class="collapsible-body" id="payment-table-body" style="display:none;">
                <table class="data-table">
                  <thead>
                    <tr>
                      <th>名稱</th>
                      <th style="text-align:right;">排序</th>
                      <th>操作</th>
                    </tr>
                  </thead>
                  <tbody id="payment-tbody">
                    <tr><td colspan="3" class="empty-state">載入中…</td></tr>
                  </tbody>
                </table>
              </div>
            </div>
          </div>
        </div>
      </main>
    </div>
  </div>

  <!-- 編輯類別 Modal -->
  <div class="modal-overlay" id="category-modal">
    <div class="modal">
      <h2 class="modal-title" id="category-modal-title">編輯類別</h2>
      <form id="category-form">
        <div class="form-stack">
          <div class="field">
            <label class="field-label" for="category-name">類別名稱</label>
            <input class="input" id="category-name" required maxlength="20" placeholder="例如：醫療類">
          </div>
          <div class="field">
            <label class="field-label" for="category-order">排序（數字越小越前）</label>
            <input class="input mono" id="category-order" type="number" min="0" placeholder="例如：1">
          </div>
        </div>
        <div class="modal-actions">
          <button type="button" class="btn btn-ghost" id="category-cancel-btn">取消</button>
          <button type="submit" class="btn btn-primary">儲存</button>
        </div>
      </form>
    </div>
  </div>

  <!-- 編輯項目 Modal -->
  <div class="modal-overlay" id="item-modal">
    <div class="modal">
      <h2 class="modal-title" id="item-modal-title">編輯項目</h2>
      <form id="item-form">
        <div class="form-stack">
          <div class="field">
            <label class="field-label" for="item-category">所屬類別</label>
            <select class="select" id="item-category" required>
              <option value="">— 請選擇 —</option>
            </select>
          </div>
          <div class="field">
            <label class="field-label" for="item-name">項目名稱</label>
            <input class="input" id="item-name" required maxlength="30" placeholder="例如：看病-濕疹">
          </div>
        </div>
        <div class="modal-actions">
          <button type="button" class="btn btn-ghost" id="item-cancel-btn">取消</button>
          <button type="submit" class="btn btn-primary">儲存</button>
        </div>
      </form>
    </div>
  </div>

  <!-- 編輯支付方式 Modal -->
  <div class="modal-overlay" id="payment-modal">
    <div class="modal">
      <h2 class="modal-title" id="payment-modal-title">編輯支付方式</h2>
      <form id="payment-form">
        <div class="form-stack">
          <div class="field">
            <label class="field-label" for="payment-name">支付方式名稱</label>
            <input class="input" id="payment-name" required maxlength="20" placeholder="例如：現金">
          </div>
          <div class="field">
            <label class="field-label" for="payment-order">排序（數字越小越前）</label>
            <input class="input mono" id="payment-order" type="number" min="0" placeholder="例如：1">
          </div>
        </div>
        <div class="modal-actions">
          <button type="button" class="btn btn-ghost" id="payment-cancel-btn">取消</button>
          <button type="submit" class="btn btn-primary">儲存</button>
        </div>
      </form>
    </div>
  </div>

  <script src="https://unpkg.com/lucide@latest"></script>
  <script type="module">
    import { initApp } from './js/app.js';
    import { initExpenseCategoriesPage } from './js/expense-categories.js';

    await initApp({ activeHref: 'expense-categories.html', title: '基礎資料管理庫' });
    initExpenseCategoriesPage();
  </script>
</body>
</html>
